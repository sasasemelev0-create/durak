<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дурак</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#1e2a38; --felt:#2b5f7a; --felt2:#24506a; --card:#f7f4ec; --ink:#1b2733;
  --red:#d4352f; --gold:#e8c06a; --white:#fff; --dim:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:#fff; user-select:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- общее ---------- */
.screen{display:none;height:100%;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.screen.on{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none}
.title{font-size:17px;font-weight:600}
.back{background:none;border:0;color:#fff;font-size:22px;padding:4px 10px 4px 0;cursor:pointer}

/* ---------- лобби ---------- */
.lobby-body{padding:0 16px 24px;flex:1}
.label{font-size:13px;color:var(--dim);margin:18px 0 8px;letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.value{font-size:28px;font-weight:700;text-align:center;margin-bottom:6px}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold) var(--p,20%),rgba(255,255,255,.2) var(--p,20%));
  outline:none;margin:10px 0;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#fff;border:3px solid var(--gold);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:4px;gap:2px}
.seg button{
  flex:1;background:none;border:0;color:#fff;padding:11px 4px;font-size:15px;font-weight:600;
  border-radius:9px;cursor:pointer;transition:.15s;font-family:inherit;
}
.seg button.on{background:#fff;color:var(--red)}
.row{display:flex;gap:10px}
.row > *{flex:1}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{
  background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:12px;
  padding:12px 4px;text-align:center;cursor:pointer;font-size:11px;line-height:1.25;
  position:relative;transition:.15s;color:#fff;font-family:inherit;
}
.mode.on{background:#fff;color:var(--ink);border-color:var(--gold)}
.mode.on::after{content:'✓';position:absolute;top:2px;right:5px;color:var(--red);font-weight:700;font-size:13px}
.mode svg{display:block;margin:0 auto 5px;width:24px;height:24px}
.pill{background:rgba(0,0,0,.22);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.pill input{
  background:none;border:0;color:#fff;font-size:16px;flex:1;outline:none;font-family:inherit;
}
.pill input::placeholder{color:rgba(255,255,255,.4)}
.btn{
  width:100%;padding:16px;border-radius:14px;border:0;font-size:17px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#fff,#e9e4d8);color:#7a2f2b}
.btn-primary:disabled{opacity:.4}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-danger{background:rgba(212,53,47,.85);color:#fff}

/* ---------- нижняя навигация ---------- */
.tabs{
  display:flex;flex:none;background:rgba(0,0,0,.28);border-top:1px solid var(--line);
  padding:8px 0 6px;
}
.tabs button{
  flex:1;background:none;border:0;color:rgba(255,255,255,.55);font-size:10px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit;
}
.tabs button.on{color:#fff}
.tabs svg{width:24px;height:24px;fill:currentColor}

/* ---------- профиль ---------- */
.profile-head{display:flex;align-items:center;gap:14px;padding:8px 16px 20px}
.avatar{
  width:64px;height:64px;border-radius:50%;background:var(--felt2);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;
  overflow:hidden;flex:none;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.pname{font-size:20px;font-weight:700}
.pstats{font-size:13px;color:var(--dim);margin-top:4px}
.card-list{padding:0 16px}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px;border-bottom:1px solid var(--line);font-size:15px;
}
.menu-item:last-child{border-bottom:0}

/* ---------- список лобби ---------- */
.room{
  background:rgba(255,255,255,.08);border-radius:14px;padding:14px;
  margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
}
.room-info{flex:1;min-width:0}
.room-id{font-weight:700;font-size:16px;letter-spacing:1px}
.room-meta{font-size:12px;color:var(--dim);margin-top:4px}
.badge{
  background:var(--gold);color:#4a3520;border-radius:8px;padding:3px 8px;
  font-size:11px;font-weight:700;margin-left:6px;
}
.badge.gray{background:rgba(255,255,255,.2);color:#fff}

/* ---------- стол ---------- */
#table-screen{background:radial-gradient(ellipse at 50% 35%,#2f6a86,#1b3b4d 70%);overflow:hidden}
.seats{
  display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 10px;flex:none;
}
.seat{
  background:rgba(0,0,0,.3);border-radius:12px;padding:8px 10px;min-width:84px;
  text-align:center;font-size:11px;border:2px solid transparent;transition:.2s;
}
.seat.turn{border-color:var(--gold);box-shadow:0 0 14px rgba(232,192,106,.4)}
.seat.defender{border-color:var(--red)}
.seat.out{opacity:.4}
.seat .sname{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;margin:0 auto}
.seat .scount{color:var(--gold);font-size:13px;font-weight:700;margin-top:2px}
.seat .stag{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}

.field{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:14px;min-height:0;padding:10px;position:relative;
}
.deck-zone{display:flex;align-items:center;gap:16px}
.deck{
  width:52px;height:74px;border-radius:7px;position:relative;
  background:linear-gradient(135deg,#3a4a63,#26324a);border:2px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
}
.deck.empty{opacity:.3}
.deck .trump{
  position:absolute;bottom:-6px;right:-8px;background:var(--card);color:var(--ink);
  border-radius:5px;padding:2px 5px;font-size:13px;font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.discard{
  width:52px;height:74px;border-radius:7px;border:2px dashed rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);
}
.battlefield{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:340px;min-height:80px}
.slot{position:relative;width:56px;height:80px}
.slot .atk,.slot .def{position:absolute;width:52px;height:74px;border-radius:7px}
.slot .atk{top:0;left:0}
.slot .def{top:8px;left:14px;transform:rotate(6deg)}

/* ---------- карты ---------- */
.card{
  width:52px;height:74px;border-radius:7px;background:var(--card);color:var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:4px 5px;font-weight:700;font-size:13px;line-height:1;
  box-shadow:0 2px 7px rgba(0,0,0,.35);position:relative;flex:none;
  transition:transform .12s;
}
.card.red{color:var(--red)}
.card .bottom{align-self:flex-end;transform:rotate(180deg)}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.5)}
.card.dim{opacity:.4}
.card.back{background:linear-gradient(135deg,#3a4a63,#26324a);border:1px solid rgba(255,255,255,.25)}

.hand{
  display:flex;gap:6px;padding:10px 12px 14px;overflow-x:auto;overflow-y:visible;flex:none;
  min-height:110px;align-items:flex-end;scrollbar-width:none;
}
.hand::-webkit-scrollbar{display:none}

.actions{display:flex;gap:8px;padding:0 12px 10px;flex:none}
.actions .btn{padding:13px;font-size:15px;border-radius:12px}

.toast{
  position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
  background:rgba(0,0,0,.88);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:13px;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center;
}
.toast.on{opacity:1}

.log{
  height:52px;overflow-y:auto;font-size:11px;color:var(--dim);
  padding:4px 14px;flex:none;text-align:center;
}
.overlay{
  position:fixed;inset:0;background:rgba(10,18,26,.9);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:50;
}
.overlay.on{display:flex}
.overlay-box{background:#243546;border-radius:20px;padding:26px 22px;text-align:center;max-width:320px;width:100%}
.overlay-box h2{margin:0 0 8px;font-size:22px}
.overlay-box p{color:var(--dim);font-size:14px;margin:0 0 20px}
.chev{font-size:11px;color:var(--gold);margin-top:2px}
.empty-note{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- ========== ПРОФИЛЬ ========== -->
  <div class="screen on" id="profile-screen">
    <div class="topbar"><div class="title">Профиль</div></div>
    <div class="profile-head">
      <div class="avatar" id="p-avatar">?</div>
      <div>
        <div class="pname" id="p-name">Игрок</div>
        <div class="pstats" id="p-stats">0 побед · 0 поражений</div>
      </div>
    </div>
    <div class="card-list">
      <div class="menu-item"><span>Победы</span><b id="p-wins">0</b></div>
      <div class="menu-item"><span>Поражения</span><b id="p-loss">0</b></div>
      <div class="menu-item"><span>Всего партий</span><b id="p-games">0</b></div>
      <div class="menu-item"><span>Монеты</span><b style="color:var(--dim)">скоро</b></div>
      <div class="menu-item"><span>Правила</span><span class="chev">›</span></div>
    </div>
  </div>

  <!-- ========== СПИСОК ЛОББИ ========== -->
  <div class="screen" id="list-screen">
    <div class="topbar">
      <div class="title">Открытые столы</div>
      <button class="back" id="refresh" title="Обновить">⟳</button>
    </div>
    <div class="lobby-body" id="rooms"></div>
  </div>

  <!-- ========== СОЗДАНИЕ ИГРЫ ========== -->
  <div class="screen" id="create-screen">
    <div class="topbar">
      <div class="title">Создать игру</div>
    </div>
    <div class="lobby-body">

      <div class="label">Игроки</div>
      <div class="seg" id="seg-players">
        <button data-v="2">2</button><button data-v="3">3</button>
        <button data-v="4">4</button><button data-v="5">5</button>
        <button data-v="6" class="on">6</button>
      </div>

      <div class="row" style="margin-top:18px">
        <div>
          <div class="label" style="margin-top:0">Колода</div>
          <div class="seg" id="seg-deck">
            <button data-v="24">24</button><button data-v="36" class="on">36</button>
            <button data-v="52">52</button>
          </div>
        </div>
        <div>
          <div class="label" style="margin-top:0">Скорость</div>
          <div class="seg" id="seg-speed">
            <button data-v="fast">▶▶</button><button data-v="normal" class="on">▶</button>
          </div>
        </div>
      </div>

      <div class="label">Режимы игры</div>
      <div class="mode-grid">
        <button class="mode on" data-mode="podkid" data-v="all">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 12h5v8h10v-8h5z"/></svg>все
        </button>
        <button class="mode" data-mode="podkid" data-v="neighbors">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h6v2H4zM4 11h6v2H4zM4 16h6v2H4zM14 6h6v2h-6zM14 11h6v2h-6zM14 16h6v2h-6z"/></svg>соседи
        </button>
        <button class="mode" data-mode="cheat" data-v="1">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 2 1 3 1 5v3h12v-3c0-2 1-3 1-5a7 7 0 0 0-7-7zm-2 6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm4 5h-4v-1h4z"/></svg>с шулерами
        </button>
        <button class="mode on" data-mode="cheat" data-v="0">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/></svg>честная
        </button>
        <button class="mode" data-mode="transfer" data-v="1">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7h11V4l5 4-5 4V9H4zm16 10H9v3l-5-4 5-4v3h11z"/></svg>переводной
        </button>
        <button class="mode" data-mode="transfer" data-v="0">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/></svg>без перевода
        </button>
        <button class="mode on" data-mode="lossMode" data-v="classic">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v3H5zm0 15h14v3H5zM7 7h10v10H7z"/></svg>классика
        </button>
        <button class="mode" data-mode="lossMode" data-v="draw">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="12" r="4"/><circle cx="16" cy="12" r="4"/></svg>ничья
        </button>
      </div>

      <div class="label">Пароль на лобби</div>
      <div class="pill">
        <span>🔒</span>
        <input id="password" placeholder="без пароля" maxlength="12" autocomplete="off">
      </div>

      <div class="label">Возврат карты</div>
      <div class="pill" style="justify-content:space-between">
        <span style="font-size:14px">Раз за партию</span>
        <b style="color:var(--gold)">5</b>
      </div>

      <div style="height:22px"></div>
      <button class="btn btn-primary" id="do-create">Создать ▶</button>
    </div>
  </div>

  <!-- ========== ЛОББИ (ожидание) ========== -->
  <div class="screen" id="room-screen">
    <div class="topbar">
      <button class="back" id="leave-room">←</button>
      <div class="title" id="room-title">Лобби</div>
      <button class="back" id="copy-room">⧉</button>
    </div>
    <div class="lobby-body">
      <div class="label">Игроки</div>
      <div id="room-players"></div>
      <div class="label">Настройки</div>
      <div id="room-opts" style="font-size:13px;color:var(--dim);line-height:1.9"></div>
      <div style="height:24px"></div>
      <button class="btn btn-primary" id="start-game">Начать игру</button>
    </div>
  </div>

  <!-- ========== СТОЛ ========== -->
  <div class="screen" id="table-screen">
    <div class="seats" id="seats"></div>
    <div class="field">
      <div class="deck-zone">
        <div class="deck" id="deck"><span id="deck-count">0</span><span class="trump" id="trump">♠</span></div>
        <div class="discard" id="discard">отбой<br><span id="discard-count">0</span></div>
      </div>
      <div class="battlefield" id="battlefield"></div>
    </div>
    <div class="log" id="log"></div>
    <div class="actions" id="actions"></div>
    <div class="hand" id="hand"></div>
  </div>

  <!-- ========== НИЖНЯЯ НАВИГАЦИЯ ========== -->
  <div class="tabs" id="tabs">
    <button data-tab="profile" class="on">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/></svg>Профиль
    </button>
    <button data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-10a5 5 0 0 1 8-4 5 5 0 0 1 8 4c0 5-8 10-8 10z"/></svg>Открытые
    </button>
    <button data-tab="create">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Создать игру
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="over-title">Игра окончена</h2>
    <p id="over-text"></p>
    <button class="btn btn-primary" id="over-close">В лобби</button>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
